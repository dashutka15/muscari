services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: muscari
      MYSQL_USER: muscari
      MYSQL_PASSWORD: muscari_local
      MYSQL_ROOT_PASSWORD: root_muscari_local
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-muscari.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -umuscari -pmuscari_local muscari -e 'SELECT 1 FROM install_state LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    environment:
      DB_HOST: db
      DB_USER: muscari
      DB_PASSWORD: muscari_local
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data:
